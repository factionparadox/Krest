# Pustota: battery first, without breaking the Framework's expansion cards.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power
WIFI_PWR_ON_BAT=on
# No USB autosuspend changes, PCIe ASPM overrides or turbo limits: those break expansion
# cards or make the laptop sluggish. Measure with: sudo powertop
