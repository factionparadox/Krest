# Tap to click, natural scrolling, and no stray clicks while typing.
Section "InputClass"
    Identifier "Pustota touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "DisableWhileTyping" "true"
    Option "ClickMethod" "clickfinger"
EndSection
