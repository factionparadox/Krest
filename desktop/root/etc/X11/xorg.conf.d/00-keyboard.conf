# English (UK) and Russian phonetic (letters on their Latin look-alikes: я on q, в on w, ж on v).
# Alt+Shift switches.
Section "InputClass"
    Identifier "Pustota keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "gb,ru"
    Option "XkbVariant" ",phonetic"
    Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
