Section "InputClass"
    Identifier "Krest keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "gb,ru"
    Option "XkbVariant" ",phonetic"
    Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
Section "Device"
    Identifier "Krest Intel"
    Driver "modesetting"
    Option "TearFree" "true"
EndSection
Section "InputClass"
    Identifier "Krest touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "DisableWhileTyping" "true"
    Option "ClickMethod" "clickfinger"
EndSection
