# Pustota: Wi-Fi power saving on for every connection (3 = enable). NetworkManager otherwise
# leaves it to the driver, and resets what TLP set each time it reconnects.
# The cost is a few milliseconds more latency; for a game or a video call that stutters,
#   nmcli connection modify NAME 802-11-wireless.powersave 2     (2 = off, for that network)
[connection]
wifi.powersave = 3
