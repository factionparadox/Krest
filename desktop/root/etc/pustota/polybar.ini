; Pustota's bar (your ~/.config/polybar/config.ini includes this file).
; Polybar is the X11 counterpart of Waybar: modules on a strip at the top of the screen.
[colors]
bg = #16161c
fg = #d8d8d8
dim = #6e6e78
red = #c8323c

[bar/pustota]
width = 100%
height = 30
dpi = ${xrdb:Xft.dpi:144}
background = ${colors.bg}
foreground = ${colors.fg}
; ratpoison leaves a 30-pixel strip free at the top (set padding in ratpoisonrc); the bar
; draws there without being treated as a window
override-redirect = true
wm-restack =
padding-left = 1
padding-right = 1
module-margin = 1
separator = ·
separator-foreground = ${colors.dim}
font-0 = DejaVu Sans Mono:size=10;2
font-1 = Noto Sans:size=10;2
modules-left = name title
modules-right = layout sound light wifi battery clock
enable-ipc = true

[module/name]
type = custom/text
format = Пустота
format-foreground = ${colors.red}

[module/title]
type = internal/xwindow
label = %title:0:60:…%

[module/layout]
; English or Russian (Alt+Shift switches)
type = internal/xkeyboard
format = <label-layout>
label-layout = %icon%
layout-icon-default = %layout%
layout-icon-0 = gb;EN
layout-icon-1 = ru;RU
label-layout-foreground = ${colors.red}

[module/sound]
type = internal/pulseaudio
label-volume = vol %percentage%%
label-muted = vol muted
label-muted-foreground = ${colors.dim}
click-right = xterm -e pulsemixer &

[module/light]
type = internal/backlight
; the Framework's Intel panel; check yours with: ls /sys/class/backlight
card = intel_backlight
label = light %percentage%%

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
label-connected = %essid%
label-disconnected = no wi-fi
label-disconnected-foreground = ${colors.dim}
click-left = networkmanager_dmenu &

[module/battery]
type = internal/battery
; the Framework names its battery BAT1 and its charger ACAD; check: ls /sys/class/power_supply
battery = BAT1
adapter = ACAD
full-at = 99
poll-interval = 10
label-charging = bat %percentage%% +
label-discharging = bat %percentage%% %time%
time-format = %H:%M
label-full = bat full
format-low = <label-low>
label-low = bat %percentage%% LOW
label-low-foreground = ${colors.red}
low-at = 15

[module/clock]
type = internal/date
interval = 10
date = %a %d %b
time = %H:%M
label = %date%  %time%
