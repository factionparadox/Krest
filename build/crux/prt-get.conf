###
### /etc/prt-get.conf: prt-get(8) configuration (Krest)
###

## the order matters: the package found first is used. Krest's own ports come first.
prtdir /usr/ports/krest
prtdir /usr/ports/core
prtdir /usr/ports/opt
prtdir /usr/ports/xorg
prtdir /usr/ports/contrib
prtdir /usr/ports/compat-32
## AUR recipes converted by krest-aur: last, so CRUX's and Krest's own ports always win
prtdir /usr/ports/aur

## every build's output is kept, one file per port (and removed when the build succeeds)
writelog enabled
logmode  overwrite
rmlog_on_success no
logfile  /var/log/pkgbuild/%n.log

readme compact
runscripts yes

# End of file
