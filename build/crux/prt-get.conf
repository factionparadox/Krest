###
### /etc/prt-get.conf: prt-get(8) configuration (Rassvet)
###

## the order matters: the package found first is used. Rassvet's own ports come first.
prtdir /usr/ports/rassvet
prtdir /usr/ports/core
prtdir /usr/ports/opt
prtdir /usr/ports/xorg
prtdir /usr/ports/contrib
prtdir /usr/ports/compat-32

## every build's output is kept, one file per port (and removed when the build succeeds)
writelog enabled
logmode  overwrite
rmlog_on_success no
logfile  /var/log/pkgbuild/%n.log

readme compact
runscripts yes

# End of file
