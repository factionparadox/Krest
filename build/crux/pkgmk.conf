#
# /etc/pkgmk.conf: pkgmk(8) configuration (Krest)
#
# Everything is built for this laptop's own processor (-march=native), with all its cores.

export CFLAGS="-O2 -march=native -pipe"
export CXXFLAGS="${CFLAGS}"

export JOBS=$(nproc)
export MAKEFLAGS="-j $JOBS"

case ${PKGMK_ARCH} in
	"64"|"")
		;;
	"32")
		export CFLAGS="${CFLAGS} -m32"
		export CXXFLAGS="${CXXFLAGS} -m32"
		export LDFLAGS="${LDFLAGS} -m32"
		export PKG_CONFIG_LIBDIR="/usr/lib32/pkgconfig"
		;;
	*)
		echo "Unknown architecture selected! Exiting."
		exit 1
		;;
esac

# downloads and finished packages in one place each, builds in /var/tmp (not in the ports tree)
PKGMK_SOURCE_DIR="/usr/ports/distfiles"
PKGMK_PACKAGE_DIR="/usr/ports/packages"
PKGMK_WORK_DIR="/var/tmp/pkgmk/$name"
PKGMK_COMPRESSION_MODE="zstd"

# End of file
